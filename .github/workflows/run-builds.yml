name: PR Build Matrix

on:
  pull_request:
    branches:
      - "tbm/SCRUM-40"
    paths:
      - "client/**"
      - "server/**"

jobs:

  client-build:
    name: Client Build (runs only when client/ changes)
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.changed_files, 'client/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: yarn
      - name: Install dependencies & build
        run: |
          cd client
          yarn install
          yarn build


  server-build:
    name: Server Docker Build (runs only when server/ changes)
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.changed_files, 'server/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push server image
        env:
          TAG: ${{ github.sha }}
        run: |
          cd server
          docker buildx build \
            --platform linux/amd64 \
            -t teammacrodash/macrodash-server:$TAG \
            -t teammacrodash/macrodash-server:latest \
            .
