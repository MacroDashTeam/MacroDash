name: Run Tests

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "client/**"
      - "server/**"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'client/**'
            server:
              - 'server/**'

  client-tests:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: yarn
          cache-dependency-path: client/yarn.lock

      - name: Install dependencies
        run: |
          cd client
          yarn install
          yarn add -D @vitest/coverage-v8

      - name: Run Jest tests with Coverage
        run: |
          cd client
          yarn vitest run --coverage --reporter=json-summary --reporter=text

      - name: Upload Client Coverage
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: client/coverage/coverage-summary.json
          retention-days: 1

  server-tests:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd server
          pip install -r requirements.txt
          pip install coverage

      - name: Run Django tests with Coverage
        run: |
          cd server
          coverage run manage.py test api.tests
          coverage json

      - name: Upload Server Coverage
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage.json
          retention-days: 1

  coverage-report:
    runs-on: ubuntu-latest
    if: always()
    needs: [client-tests, server-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Client Coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: client-coverage
          path: client/coverage

      - name: Download Server Coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: server-coverage
          path: server

      - name: Display Coverage Report
        uses: ./.github/actions/display-coverage
        with:
          client_coverage_path: client/coverage/coverage-summary.json
          server_coverage_path: server/coverage.json
