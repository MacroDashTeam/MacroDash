name: Deploy All

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: false
        default: "production"

jobs:
  deploy-client:
    uses: ./.github/workflows/deploy-client.yml
    secrets: inherit

  deploy-server:
    needs: deploy-client
    uses: ./.github/workflows/deploy-server.yml
    secrets: inherit
