name: Deploy Server

on:
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    env:
      VERSION_SHA: ${{ github.sha }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      SERVICE_NAME: macrodash-server

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image to Docker Hub
      run: |
        cd server
        TAG=${VERSION_SHA::7}
        docker buildx build \
          --platform linux/amd64 \
          -t teammacrodash/macrodash-server:$TAG \
          -t teammacrodash/macrodash-server:latest \
          --push .

    - name: Install Lightsail Control Plugin
      run: |
        curl "https://s3.us-east-2.amazonaws.com/amazonlightsail-us-east-2/lightsailctl/latest/linux-amd64/lightsailctl" \
          -o /usr/local/bin/lightsailctl
        chmod +x /usr/local/bin/lightsailctl

    - name: Push image to Lightsail registry
      run: |
        TAG=${VERSION_SHA::7}
        aws lightsail push-container-image \
          --service-name $SERVICE_NAME \
          --label macrodash \
          --image teammacrodash/macrodash-server:$TAG

    - name: Render deployment config (image + API keys)
      run: |
        TAG=${VERSION_SHA::7}
        IMAGE="macrodash/macrodash-server:$TAG"   # This references the Lightsail registry label
        sed \
          -e "s|__IMAGE__|$IMAGE|g" \
          -e "s|\"FRED_API_KEY\": \".*\"|\"FRED_API_KEY\": \"${{ secrets.FRED_API_KEY }}\"|g" \
          -e "s|\"ALPHA_VANTAGE_API_KEY\": \".*\"|\"ALPHA_VANTAGE_API_KEY\": \"${{ secrets.ALPHA_VANTAGE_API_KEY }}\"|g" \
          -e "s|\"OPENAI_API_KEY\": \".*\"|\"OPENAI_API_KEY\": \"${{ secrets.OPENAI_API_KEY }}\"|g" \
          -e "s|\"COINMARKETCAP_API_KEY\": \".*\"|\"COINMARKETCAP_API_KEY\": \"${{ secrets.COINMARKETCAP_API_KEY }}\"|g" \
          -e "s|\"MONGODB_URI\": \".*\"|\"MONGODB_URI\": \"${{ secrets.MONGODB_URI }}\"|g" \
          server/containers.json > server/containers.out.json

    - name: Deploy updated container to Lightsail
      run: |
        aws lightsail create-container-service-deployment \
          --service-name $SERVICE_NAME \
          --containers file://server/containers.out.json \
          --public-endpoint file://server/public-endpoint.json
